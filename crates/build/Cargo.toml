[package]
name = "qubitick-build"
description = "Orchestrates the build: parse, write, hash, index, emit, lean check/build"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
qubitick-model = { workspace = true }
qubitick-db = { workspace = true }
qubitick-parse = { workspace = true }
qubitick-emit = { workspace = true }
qubitick-ctx = { workspace = true }
qubitick-rewrite = { workspace = true }
qubitick-pattern = { workspace = true }
rusqlite = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The PDF tests compile the document with whichever engine is installed, which means they
# belong beside the code that writes it. `qubitick-pdf` does not depend on this crate, so
# this is a test-only edge and not a cycle.
qubitick-pdf = { workspace = true }
