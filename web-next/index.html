<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Qubitick — canvas world</title>
<link rel="stylesheet" href="/css/canvas.css" />
<link rel="stylesheet" href="/css/fonts.css" />
<link rel="stylesheet" href="/css/skin.css" />
<link rel="stylesheet" href="/css/field.css" />
<link rel="stylesheet" href="/css/themes.css" />
</head>
<body>
<div id="loadbar"></div>
<div id="viewport">
  <div id="grid"></div>
  <div id="world"></div>
</div>
<div id="rail">
  <span class="r-seg r-mode" id="r-mode">NORMAL</span>
  <span class="r-seg" id="r-pos">Ln 1, Col 1</span>
  <span class="r-seg r-file" id="r-file">—</span>
  <span class="r-seg r-dirty hidden" id="r-dirty">● unsaved</span>
  <span class="r-spacer"></span>
  <span class="r-seg"><i>nodes</i><b id="r-nodes">–</b></span>
  <span class="r-seg"><i>sym</i><b id="r-sym">–</b></span>
  <span class="r-seg"><i>zoom</i><b id="r-zoom">100%</b></span>
  <span class="r-seg r-check" id="r-check">idle</span>
</div>
<div id="toast"></div>
<canvas id="wire-canvas" aria-hidden="true"></canvas>
<script type="module" src="/js/main.js"></script>
</body>
</html>
