<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Qubitick — Docking shell</title>
<!--
  THE DEFAULT PAGE, and it is deliberately this small: the shell is a module tree
  (web-next/js/dock), and this file hands it a #dock element and gets out of the way.

  Where things live:
    js/dock/model.js    the layout as data — five regions, tab groups, presets
    js/dock/render.js   the DOM, the sashes, the collapsing
    js/dock/app.js      the assembly: panes, wiring, status, palette, keys
    js/panes/*.js       one module per panel kind — a panel does not know which page it is in
    index.html          the canvas workspace, still there, still the same engine
-->
<link rel="stylesheet" href="/css/skin.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/fonts.css" />
<!-- the PANES' own styles: a panel is the workspace's module and wears the same skin in
     either app, so the dock page loads what the canvas and the shell load for them. -->
<link rel="stylesheet" href="/css/panes.css" />
<link rel="stylesheet" href="/css/field.css" />
<link rel="stylesheet" href="/css/dock.css" />
</head>
<body>
<div id="dock"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
